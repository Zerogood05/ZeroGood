kind = "web"
previewPath = "/"
title = "Discord Lookup & Social Links"
version = "1.0.0"
id = "artifacts/discord-lookup"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25293

[services.development]
run = "pnpm --filter @workspace/discord-lookup run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/discord-lookup", "run", "build" ]
publicDir = "artifacts/discord-lookup/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25293"
BASE_PATH = "/"
